<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3대 모녀 맞춤 교토 힐링 &amp; 덕질 여행</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="stage">
    <div id="deck"></div>
  </main>

  <nav id="controls" aria-label="슬라이드 이동">
    <button id="prev" aria-label="이전 슬라이드">‹</button>
    <span id="counter">1 / 1</span>
    <button id="next" aria-label="다음 슬라이드">›</button>
    <button id="fullscreen" aria-label="전체 화면">⛶</button>
  </nav>
  <div id="progress"><span></span></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
